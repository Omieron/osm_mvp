version: '3.8'

services:
  backend:
    build: ./Backend
    container_name: osm_backend
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:123@db:5432/osm_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:14
    container_name: osm_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: osm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d osm_db"]
      interval: 5s
      retries: 5

  frontend:
    image: nginx:alpine
    container_name: osm_frontend
    volumes:
      - ./Frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata: